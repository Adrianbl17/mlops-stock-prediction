name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'nginx/**'
      - 'helm/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/adrianbl17/mlops-stock-api:latest
            ghcr.io/adrianbl17/mlops-stock-api:${{ github.sha }}

      - name: Build and push NGINX image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/adrianbl17/mlops-stock-nginx:latest
            ghcr.io/adrianbl17/mlops-stock-nginx:${{ github.sha }}

      - name: Create namespace if needed
        run: kubectl create namespace mlops-stock --dry-run=client -o yaml | kubectl apply -f - --kubeconfig "$env:USERPROFILE\.kube\config"

      - name: Create secret if needed
        run: kubectl create secret generic stock-secret --from-env-file=.env -n mlops-stock --dry-run=client -o yaml | kubectl apply -f - --kubeconfig "$env:USERPROFILE\.kube\config"

      - name: Helm upgrade
        run: helm upgrade --install stock-prediction ./helm/stock-prediction --namespace mlops-stock --set api.image=ghcr.io/adrianbl17/mlops-stock-api:${{ github.sha }} --set nginx.image=ghcr.io/adrianbl17/mlops-stock-nginx:${{ github.sha }} --kubeconfig "$env:USERPROFILE\.kube\config"

      - name: Verify deployment
        run: kubectl get pods -n mlops-stock --kubeconfig "$env:USERPROFILE\.kube\config"